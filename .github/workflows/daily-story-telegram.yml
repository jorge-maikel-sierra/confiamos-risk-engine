name: Daily Telegram Story Dispatcher

on:
  schedule:
    # 8:00 AM America/Bogota (UTC-5) -> 13:00 UTC todos los días
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Número de día específico a despachar (opcional)'
        required: false
        type: string
        default: ''

jobs:
  dispatch-story:
    name: Dispatch Daily Story to Telegram
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "apps/api/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Dispatch Story
        env:
          PYTHONPATH: apps/api
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${{ github.event.inputs.day }}" ]; then
            python apps/api/src/bot/send_daily_story.py --day "${{ github.event.inputs.day }}"
          else
            python apps/api/src/bot/send_daily_story.py
          fi

      - name: Commit & Push Counter Advancement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain apps/api/data/daily_story_state.json)" ]; then
            git add apps/api/data/daily_story_state.json
            git commit -m "chore(bot): avanzar contador diario del proyecto a 100 dias [skip ci]"
            git push
          else
            echo "No state change detected."
          fi
