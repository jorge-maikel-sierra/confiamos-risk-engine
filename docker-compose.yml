services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: confiamos-postgres
    restart: always
    environment:
      POSTGRES_USER: confiamos_user
      POSTGRES_PASSWORD: confiamos_password
      POSTGRES_DB: confiamos_risk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confiamos_user -d confiamos_risk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgweb:
    image: sosedoff/pgweb
    container_name: confiamos-pgweb
    restart: always
    environment:
      PGWEB_DATABASE_URL: postgres://confiamos_user:confiamos_password@postgres:5432/confiamos_risk_db?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
